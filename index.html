<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sou9i - Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f0e6;
      --beige: #e7d5bd;
      --beige-light: #efe3d3;
      --brown: #604638;
      --brown-dark: #463329;
      --brown-light: #876b58;
      --white: #ffffff;
      --border: #dfcfbd;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--brown-dark);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background: rgba(231, 213, 189, 0.96);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(70, 51, 41, 0.08);
    }

    .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: var(--brown);
      letter-spacing: -1px;
    }

    .menu {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      cursor: pointer;
      color: var(--brown);
      background: rgba(255,255,255,0.55);
    }

    /* MOBILE MENU */
    .mobile-menu {
      display: none;
      max-width: 1100px;
      margin: 12px auto 0;
      background: var(--white);
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu div {
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    .mobile-menu div:hover {
      background: var(--beige-light);
    }

    /* HERO */
    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 65px 20px 45px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      color: var(--brown-dark);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .hero p {
      font-size: 18px;
      color: var(--brown-light);
      margin-bottom: 28px;
    }

    /* SEARCH */
    .search {
      max-width: 680px;
      margin: auto;
      display: flex;
      background: var(--white);
      border-radius: 50px;
      padding: 6px;
      box-shadow: 0 8px 25px rgba(70,51,41,0.10);
      border: 1px solid rgba(223,207,189,0.7);
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 14px 18px;
      font-size: 16px;
      border-radius: 40px;
      color: var(--brown-dark);
      background: transparent;
    }

    .search button {
      border: none;
      background: var(--brown-light);
      color: white;
      padding: 0 24px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .search button:hover {
      background: var(--brown);
    }

    /* SECTIONS */
    .section {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px 35px;
    }

    .section-title {
      font-size: 27px;
      margin-bottom: 18px;
      color: var(--brown-dark);
    }

    /* CATEGORIES */
    .category-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 3px 2px 12px;
      scrollbar-width: none;
    }

    .category-list::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--brown-dark);
      padding: 11px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .category:hover,
    .category.active {
      background: var(--brown);
      color: white;
      border-color: var(--brown);
    }

    /* PRODUCTS */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      position: relative;
      background: var(--white);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(70,51,41,0.08);
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(70,51,41,0.13);
    }

    .favorite {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      font-size: 19px;
      cursor: pointer;
      z-index: 2;
    }

    .favorite.active {
      color: #a55b50;
    }

    .product-image {
      height: 210px;
      background: var(--beige-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .card-content {
      padding: 17px;
    }
